<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炉石传说 · 酒馆战棋 · 全卡牌</title>
<style>
  :root{
    --bg:#1a1a2e; --bg2:#16213e; --card:#1a1a3e; --card2:#222255;
    --gold:#f0d9a8; --gold2:#d4b06c; --gold-dim:#a08868;
    --txt:#e8e0d0; --txt2:#a09080; --line:#3a3a5e; --on-gold:#2a1f10;
    --accent:#80d0ff; --img-max-w:144px;
    --topbar-bg:rgba(26,26,46,.95); --filters-bg:rgba(22,33,62,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;
    background-image:radial-gradient(1200px 600px at 50% -200px,rgba(100,80,180,.06),transparent 60%)}
  a{color:var(--gold2)}
  .header-wrap{position:fixed;top:0;left:0;right:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.3);will-change:transform}
  .topbar{background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 16px 9px}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .topbar h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:1px;font-weight:600;flex:1;min-width:240px}
  .topbar h1 .sub{font-size:12px;color:#909090;font-weight:400;margin-left:8px}
  .title-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
  .title-ctl > *{flex-shrink:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:6px 16px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--txt2);
    cursor:pointer;font-size:15px;transition:.18s;user-select:none}
  .tab:hover{color:var(--gold);border-color:var(--gold-dim)}
  .tab.active{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--on-gold);border-color:var(--gold);font-weight:600}
  .tab .n{font-size:13px;opacity:.8;margin-left:2px}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:8px 32px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:14px;outline:none}
  .search input:focus{border-color:var(--gold-dim)}
  .search::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:16px}
  .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;transition:.15s}
  .search-clear:hover{border-color:var(--gold-dim);background:rgba(201,169,97,.18)}
  .search.has-value .search-clear{display:flex}
  .count{font-size:14px;color:var(--txt2);white-space:nowrap}
  .count b{color:var(--gold)}
.img-size-ctl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--txt2)}
  .img-size-ctl input{width:90px;cursor:pointer;accent-color:var(--gold2)}
  .img-size-ctl #imgSizeVal{min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
  .theme-switch{display:flex;gap:7px;align-items:center}
  .theme-dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);cursor:pointer;
    transition:.15s;padding:0;background:var(--t-dot);user-select:none;caret-color:transparent}
  .theme-dot:hover{transform:scale(1.15)}
  .theme-dot.active{border-color:var(--txt);box-shadow:0 0 0 2px var(--bg)}
  .header-ctl{display:flex;gap:6px;position:relative;align-items:center;flex-shrink:0}
  .pin-btn,.auto-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:color .15s,border-color .15s,background .15s,transform .3s ease,opacity .3s ease;user-select:none;flex-shrink:0;position:relative}
  .pin-btn svg{transition:transform .2s}
  .pin-btn:not(.pinned){color:#9a9a9a;border-color:var(--line);background:transparent}
  .pin-btn:not(.pinned) svg{transform:rotate(-45deg)}
  .pin-btn:hover,.auto-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
  .pin-btn.pinned{background:var(--gold2);color:var(--on-gold);border-color:var(--gold)}
  .auto-btn{z-index:2;font-size:14px;font-weight:700;position:relative}
  .pin-btn{z-index:1}
  .pin-btn.folded{transform:scale(0.3) translateX(36px);opacity:0;pointer-events:none}
  .auto-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .pin-btn.disabled,.auto-btn.disabled{opacity:.35;cursor:default;pointer-events:none}
  .filters{padding:9px 16px;border-bottom:1px solid var(--line);background:var(--filters-bg)}
  .dim{display:flex;align-items:flex-start;gap:8px;margin:5px 0;flex-wrap:wrap}
  .dim-label{min-width:52px;font-size:13px;color:var(--gold-dim);padding-top:5px;flex-shrink:0}
  .dim-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center}
  .ftag{padding:3px 12px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);color:var(--txt2);cursor:pointer;font-size:13px;user-select:none;transition:.15s;white-space:nowrap}
  .ftag:hover{color:var(--gold);border-color:var(--gold-dim)}
  .ftag.active{background:var(--gold2);color:var(--on-gold);border-color:var(--gold);font-weight:600}
  .ftag .fc{font-size:12px;opacity:.7;margin-left:3px}
  .clear-btn{padding:3px 12px;border-radius:13px;border:1px dashed var(--line);background:transparent;color:var(--txt2);cursor:pointer;font-size:13px;white-space:nowrap}
  .clear-btn:hover{color:#ff8080;border-color:#ff8080}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;padding:4px 8px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;display:flex;flex-direction:column}
  .card-img-wrap{position:relative;overflow:hidden;background:var(--bg2);display:flex;justify-content:center}
  .card-img-wrap img{width:var(--img-max-w,144px);height:calc(var(--img-max-w,144px) * 1.15);object-fit:cover;object-position:center;display:block}
  .card-img-wrap.no-img{min-height:60px;display:flex;align-items:center;justify-content:center}
  .card-img-wrap.no-img img{display:none}
  .card-img-wrap.no-img::after{content:attr(data-name);font-size:12px;color:var(--txt2);padding:4px;text-align:center}
  .card-overlay{position:absolute;top:0;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:4px 6px 4px 16px;background:linear-gradient(225deg,rgba(0,0,0,.88) 20%,rgba(0,0,0,.5) 60%,transparent 100%);border-radius:0 6px 0 6px;pointer-events:none;max-width:100%}
  .ov-name{font-size:14px;font-weight:700;color:var(--gold);text-shadow:0 1px 2px #000,0 0 3px #000;max-width:140px;text-align:right;line-height:1.2}
  .ov-tier{font-size:12px;font-weight:700;color:#fff;padding:1px 7px;border-radius:3px;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .ov-tier.t1,.ov-tier.t2{background:#1a6b3c}
  .ov-tier.t3{background:#2a6b9a}
  .ov-tier.t4{background:#6a3a8a}
  .ov-tier.t5{background:#8a4a1a}
  .ov-tier.t6{background:#b8860b}
  .ov-tier.t7{background:#c0392b}
  .ov-race{font-size:11px;color:var(--gold2);text-shadow:0 1px 2px #000;text-align:right}
  .ov-mechs{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:150px}
  .mt{font-size:10px;padding:0 5px;border-radius:2px;color:#fff;line-height:1.5;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .mt.battlecry,.mt.start_of_combat,.mt.bacon_rally{background:#e09050}
  .mt.deathrattle,.mt.invisibledethrattle{background:#b080e0}
  .mt.divine_shield{background:#f0e060;color:#1a1a2e;text-shadow:none}
  .mt.windfury{background:#60e0d0;color:#1a1a2e;text-shadow:none}
  .mt.reborn{background:#e080b0}
  .mt.venomous,.mt.poisonous{background:#60e060}
  .mt.magnetic{background:#80c0e0;color:#1a1a2e;text-shadow:none}
  .mt.stealth,.mt.immune,.mt.bacon_pass_tooltip{background:#a0a0a0}
  .mt.taunt{background:#d4b06c;color:#1a1a2e;text-shadow:none}
  .mt.aura,.mt.trigger_visual,.mt.end_of_turn_trigger,.mt.choose_one,.mt.discover,.mt.adjacent_buff,.mt.avenge,.mt.bacon_spellcraft_id,.mt.bacon_refresh_tooltip{background:#80b0ff}
  .mt.rush{background:#ff6060}
  .mt.bacon_blood_gem_tooltip{background:#c08060}
  .ov-wr{font-size:12px;font-weight:700;color:#60e060;text-shadow:0 1px 2px #000}
  .ov-armor{font-size:11px;color:#b090e0;text-shadow:0 1px 2px #000}
  .ov-cost{font-size:11px;font-weight:700;color:#80b0ff;text-shadow:0 1px 2px #000}
  .ov-type{font-size:11px;font-weight:600;text-shadow:0 1px 2px #000}
  .ov-type.greater{color:#e09050}
  .ov-type.lesser{color:#80e080}
  .card-desc{padding:4px 8px 5px;font-size:12px;line-height:1.35;color:var(--txt);flex:1;word-break:break-word}
  .card-desc b{color:var(--gold2)}
  .card-desc i{color:var(--txt2);font-size:11px}
  .hp-cost{display:inline-block;background:var(--gold2);color:var(--on-gold);padding:0 5px;border-radius:2px;font-size:11px;font-weight:700;margin:0 2px}
  mark.hl{background:rgba(255,220,90,.38);color:#fff8d8;border-radius:2px;padding:0 1px}
  body[data-mode="light"] mark.hl{background:rgba(255,200,40,.6);color:#2a1f10}
  .empty{text-align:center;color:var(--txt2);padding:80px 20px;grid-column:1/-1}
  .src{padding:8px 12px 40px;font-size:11px;color:var(--txt2);text-align:center}
  .src a{color:var(--gold2)}
  body[data-mode="light"] .card-overlay .ov-name,
  body[data-mode="light"] .card-overlay .ov-race,
  body[data-mode="light"] .card-overlay .ov-wr,
  body[data-mode="light"] .card-overlay .ov-armor,
  body[data-mode="light"] .card-overlay .ov-cost,
  body[data-mode="light"] .card-overlay .ov-type{color:#fff}
  @media(max-width:560px){.grid{grid-template-columns:1fr;padding:4px}.topbar{padding:7px 10px 5px}.filters{padding:5px 10px}.toolbar{gap:8px}.search{min-width:140px;flex-basis:100%}}
</style>
</head>

    try{
      return String(s).replace(new RegExp('('+escRe(term)+')','gi'), '<mark class="hl">$1</mark>');
    }catch(err){ return String(s); }
  }
  // 文本节点高亮（尊重已有 HTML 标签，只替换标签外文本；返回含 <mark> 的 HTML）
  function hlText(t){
    const term = searchTerm;
    return String(t==null?'':t).split(/(<[^>]*>)/g).map(function(seg,i){
      if(i%2===1) return seg;
      let s = seg;
      if(term) s = hlMatch(s, term);
      return s.replace(/\n/g,'<br>');
    }).join('');
  }
  // 转义后高亮（用于名称/种族等纯文本域）
  function hlName(text){
    const e = esc(text);
    if(!searchTerm) return e;
    try{
      return e.replace(new RegExp('('+escRe(esc(searchTerm))+')','gi'), function(m){ return '<mark class="hl">'+m+'</mark>'; });
    }catch(err){ return e; }
  }
  function raceStr(c){
    if(!c.raceDisplay || !c.raceDisplay.length) return '';
    return c.raceDisplay.join('/');
  }
  function mechTags(c){
    if(!c.mechanics || !c.mechanics.length) return '';
    return c.mechanics.map(function(k,i){
      const disp = MECH_DISPLAY[k] || (c.mechanicsDisplay && c.mechanicsDisplay[i]) || k;
      return '<span class="mt '+k.toLowerCase()+'">'+esc(disp.trim())+'</span>';
    }).join('');
  }
  function matchRace(c, key){
    if(key==='NONE') return !c.races || c.races.length===0;
    if(key==='ALL') return c.races && c.races.indexOf('ALL')>=0;
    return c.races && (c.races.indexOf(key)>=0 || c.races.indexOf('ALL')>=0);
  }

  // ---------- 数据获取与过滤 ----------
  function getCards(){ return DATA[CAT_MAP[currentTab]] || []; }

  function matchesSearch(c){
    if(!searchTerm) return true;
    const t = searchTerm.toLowerCase();
    const parts = [c.name, c.text];
    if(c.raceDisplay) parts.push(Array.isArray(c.raceDisplay)?c.raceDisplay.join(' '):c.raceDisplay);
    if(c.mechanicsDisplay) parts.push(Array.isArray(c.mechanicsDisplay)?c.mechanicsDisplay.join(' '):c.mechanicsDisplay);
    if(c.heroPowerName) parts.push(c.heroPowerName);
    if(c.heroPowerText) parts.push(c.heroPowerText);
    if(c.updated) parts.push('更新 '+c.updated);
    return parts.filter(function(x){return x;}).join(' ').toLowerCase().indexOf(t)>=0;
  }

  // 过滤所有维度（exceptDim 之外的维度），并叠加搜索
  function filteredExcept(exceptDim){
    let cards = getCards().filter(matchesSearch);
    const f = activeFilters;
    return cards.filter(function(c){
      if(exceptDim!=='race' && f.race && !matchRace(c, f.race)) return false;
      if(exceptDim!=='tier' && f.tier && c.tier !== parseInt(f.tier,10)) return false;
      if(exceptDim!=='mechanic' && f.mechanic && !(c.mechanics && c.mechanics.indexOf(f.mechanic)>=0)) return false;
      if(exceptDim!=='spellCost' && f.spellCost && c.cost !== parseInt(f.spellCost,10)) return false;
      if(exceptDim!=='spellTier' && f.spellTier && c.tier !== parseInt(f.spellTier,10)) return false;
      if(exceptDim!=='trinketType' && f.trinketType && (!!c.isGreater) !== (f.trinketType==='greater')) return false;
      return true;
    });
  }
  function filteredCards(){ return filteredExcept(null); }

  // ---------- 渲染卡片 ----------
  function renderCard(c){
    const imgUrl = currentTab==='hero' ? 'https://art.hearthstonejson.com/v1/256x/'+c.id+'.webp' : 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/'+c.id+'.png';
    let overlay = '', desc = '';
    if(currentTab==='minion'){
      overlay += '<div class="ov-name">'+hlName(c.name)+'</div>';
      if(c.tier) overlay += '<div class="ov-tier t'+c.tier+'">'+c.tier+'星</div>';
      const rs = raceStr(c);
      if(rs) overlay += '<div class="ov-race">'+hlName(rs)+'</div>';
      const mt = mechTags(c);
      if(mt) overlay += '<div class="ov-mechs">'+mt+'</div>';
      desc = '<div class="card-desc">'+hlText(c.text)+'</div>';
    } else if(currentTab==='hero'){
      overlay += '<div class="ov-name">'+hlName(c.name)+'</div>';
      if(c.winrate!=null && c.winrate!=='' && !isNaN(c.winrate)) overlay += '<div class="ov-wr">'+c.winrate+'%</div>';
      if(c.armor!=null) overlay += '<div class="ov-armor">护甲 '+c.armor+'</div>';
      let hp = '';
      const hasName = !!(c.heroPowerName && String(c.heroPowerName).length);
      const hasText = !!(c.heroPowerText && String(c.heroPowerText).length);
      if(hasName || hasText){
        if(hasName) hp += '<b>'+hlName(c.heroPowerName)+'</b> ';
        if(c.heroPowerCost!=null && c.heroPowerCost!=='') hp += '<span class="hp-cost">'+c.heroPowerCost+'</span>';
        if(hasText) hp += ((hasName||c.heroPowerCost!=null) ? ': ' : '') + hlText(c.heroPowerText);
      } else if(c.text){
        hp = hlText(c.text);
      }
      desc = hp ? '<div class="card-desc">'+hp+'</div>' : '';
    } else if(currentTab==='spell'){
      overlay += '<div class="ov-name">'+hlName(c.name)+'</div>';
      overlay += '<div class="ov-cost">'+c.cost+'铸币</div>';
      if(c.tier) overlay += '<div class="ov-tier t'+c.tier+'">'+c.tier+'星</div>';
      desc = '<div class="card-desc">'+hlText(c.text)+'</div>';
    } else if(currentTab==='trinket'){
      overlay += '<div class="ov-name">'+hlName(c.name)+'</div>';
      overlay += '<div class="ov-cost">'+c.cost+'铸币</div>';
      overlay += '<div class="ov-type '+(c.isGreater?'greater':'lesser')+'">'+(c.isGreater?'大型':'小型')+'</div>';
      desc = '<div class="card-desc">'+hlText(c.text)+'</div>';
    } else { // quest / anomaly
      overlay += '<div class="ov-name">'+hlName(c.name)+'</div>';
      desc = '<div class="card-desc">'+hlText(c.text)+'</div>';
    }
    const cls = currentTab==='hero' ? 'card hero-card' : 'card';
    return '<div class="'+cls+'">'+
      '<div class="card-img-wrap" data-name="'+esc(c.name)+'">'+
        '<img src="'+imgUrl+'" loading="lazy" onerror="this.parentElement.classList.add(\'no-img\')">'+
        '<div class="card-overlay">'+overlay+'</div>'+
      '</div>'+desc+
    '</div>';
  }

  function renderGrid(){
    const cards = filteredCards();
    if(!cards.length){ grid.innerHTML='<div class="empty">没有匹配的卡牌</div>'; return; }
    grid.innerHTML = cards.map(renderCard).join('');

  // ---------- 渲染过滤器 ----------
  function dimRow(label, tags, dim){
    if(!tags) return '';
    let html = '<div class="dim"><span class="dim-label">'+label+'</span><div class="dim-tags">'+tags;
    if(activeFilters[dim]) html += '<span class="clear-btn" data-clear="'+dim+'">清除</span>';
    html += '</div></div>';
    return html;
  }
  function ftag(dim, val, label, n, active){
    if(n===0 && !active) return '';
    return '<span class="ftag'+(active?' active':'')+'" data-dim="'+dim+'" data-val="'+esc(val)+'">'+label+'<span class="fc">'+n+'</span></span>';

  function renderFilters(){
    const container = document.getElementById('filters');
    let html = '';
    if(currentTab==='minion'){
      // 种族
      const raceBase = filteredExcept('race');
      let raceTags = (DATA.meta.races||[]).map(function(r){
        const n = raceBase.filter(function(c){ return matchRace(c, r.key); }).length;
        return ftag('race', r.key, r.display, n, activeFilters.race===r.key);
      }).join('');
      html += dimRow('种族', raceTags, 'race');
      // 等级
      const tierBase = filteredExcept('tier');
      let tierTags = '';
      for(let i=1;i<=7;i++){
        const n = tierBase.filter(function(c){ return c.tier===i; }).length;
        tierTags += ftag('tier', i, i+'星', n, activeFilters.tier===String(i));
      }
      html += dimRow('等级', tierTags, 'tier');
      // 机制
      const allMechs = {};
      (DATA.minions||[]).forEach(function(c){ if(c.mechanics) c.mechanics.forEach(function(m){ if(!allMechs[m]) allMechs[m]=MECH_DISPLAY[m]||m; }); });
      const mechBase = filteredExcept('mechanic');
      let mechTagsHtml = Object.keys(allMechs).map(function(k){
        const n = mechBase.filter(function(c){ return c.mechanics && c.mechanics.indexOf(k)>=0; }).length;
        return ftag('mechanic', k, allMechs[k], n, activeFilters.mechanic===k);
      }).join('');
      html += dimRow('机制', mechTagsHtml, 'mechanic');
    } else if(currentTab==='spell'){
      const costBase = filteredExcept('spellCost');
      let costTags = [1,2,3,4,5].map(function(i){
        const n = costBase.filter(function(c){ return c.cost===i; }).length;
        return ftag('spellCost', i, i+'铸币', n, activeFilters.spellCost===String(i));
      }).join('');
      html += dimRow('费用', costTags, 'spellCost');
      const tierBase = filteredExcept('spellTier');
      let tierTags = '';
      for(let i=1;i<=7;i++){
        const n = tierBase.filter(function(c){ return c.tier===i; }).length;
        tierTags += ftag('spellTier', i, i+'星', n, activeFilters.spellTier===String(i));
      }
      html += dimRow('等级', tierTags, 'spellTier');
    } else if(currentTab==='trinket'){
      const base = filteredExcept('trinketType');
      const nL = base.filter(function(c){ return !c.isGreater; }).length;
      const nG = base.filter(function(c){ return !!c.isGreater; }).length;
      let tags = ftag('trinketType','lesser','小型',nL,activeFilters.trinketType==='lesser');
      tags += ftag('trinketType','greater','大型',nG,activeFilters.trinketType==='greater');
      html += dimRow('类型', tags, 'trinketType');
    }
    container.innerHTML = html;
    bindFilterEvents(container);
  }

    container.querySelectorAll('.ftag').forEach(function(el){

  // ---------- 顶栏控制（pin / auto）----------
  (function headerCtrl(){
    const wrap = document.getElementById('headerWrap');
    const pinBtn = document.getElementById('pinBtn');
    const autoBtn = document.getElementById('autoBtn');
    let mode = 'sticky';
    let prevMode = 'sticky';
    let currentP = 1, targetP = 1;
    let hideUntilMove = false;
    let sliderLock = false;
    const DAMP = 12;
    let rafId = null, lastT = 0;
    let scrollY = window.scrollY || 0;
    let curH = 0, maxH = 0, lastMove = 0, mouseIn = false;
    const getSY = function(){ return window.scrollY || document.documentElement.scrollTop || 0; };

    function updateT(){ wrap.style.transform = 'translateY(' + (-scrollY*(1-currentP)) + 'px)'; }
    function tick(now){
      if(!lastT) lastT = now;
      const dt = Math.min((now-lastT)/1000, 0.05);
      lastT = now;
      currentP += (targetP-currentP) * (1-Math.exp(-DAMP*dt));
      if(Math.abs(targetP-currentP) < 0.001){ currentP = targetP; rafId = null; lastT = 0; }
      updateT();
      if(rafId) rafId = requestAnimationFrame(tick);
    }
    function start(){ if(!rafId){ lastT = 0; rafId = requestAnimationFrame(tick); } }
    function tooSmall(){ return maxH > window.innerHeight * 0.9; }
    function syncBtns(){
      const ts = tooSmall();
      pinBtn.classList.toggle('pinned', mode==='pinned' && !ts);
      pinBtn.classList.toggle('folded', mode==='auto' && !ts);
      pinBtn.classList.toggle('disabled', ts);
      autoBtn.classList.toggle('active', mode==='auto' && !ts);
      autoBtn.classList.toggle('disabled', ts);
      if(ts){
        pinBtn.title = '窗口高度不足，顶栏已固定';
        autoBtn.title = '窗口高度不足';
      } else {
        pinBtn.title = mode==='pinned'
          ? '顶栏固定在网页顶部（点击切换为随显示区域移动）'
          : '顶栏随显示区域移动（点击切换为固定在网页顶部）';
        autoBtn.title = mode==='auto'
          ? '自动模式已开启（点击关闭）'
          : '自动切换模式（滚轮隐藏，移到顶部显示）';
      }
    }
    function save(){ try{ localStorage.setItem('hs_header_mode', mode); }catch(e){} }
    function updTarget(){
      if(tooSmall()) targetP = 0;
      else if(sliderLock) targetP = 1; // 按住缩放滑块时保持固定显示
      else if(mode==='sticky') targetP = 1;
      else if(mode==='pinned') targetP = 0;
      else targetP = (scrollY < 8 || (mouseIn && !hideUntilMove)) ? 1 : 0;
      start(); syncBtns();
    }
    window._headerSliderHold = function(held){
      sliderLock = held;
      if(held) hideUntilMove = false;
      updTarget();
    };
    pinBtn.addEventListener('click', function(){
      if(tooSmall() || mode==='auto') return;
      mode = mode==='pinned' ? 'sticky' : 'pinned';
      updTarget(); save();
    });
    autoBtn.addEventListener('click', function(){
      if(tooSmall()) return;
      if(mode==='auto'){ mode = prevMode; }
      else { prevMode = mode; mode = 'auto'; }
      updTarget(); save();
    });
    window.addEventListener('scroll', function(){
      scrollY = getSY();
      if(tooSmall()){ targetP = 0; currentP = 0; updateT(); return; }
      if(mode==='auto' && scrollY >= 8) hideUntilMove = true;
      if(mode==='sticky' && Math.abs(currentP-1) < 0.001){ currentP = 1; targetP = 1; updateT(); return; }
      if(mode==='pinned' && Math.abs(currentP) < 0.001){ currentP = 0; targetP = 0; updateT(); return; }
      updTarget();
    }, {passive:true});
    document.addEventListener('mousemove', function(e){
      if(mode!=='auto' || tooSmall()) return;
      const now = performance.now();
      if(now - lastMove < 16) return;
      lastMove = now;
      const wasLocked = hideUntilMove;
      hideUntilMove = false;
      const inZ = e.clientY <= curH;
      if(mouseIn !== inZ || wasLocked){ mouseIn = inZ; updTarget(); }
    });
    document.addEventListener('mouseleave', function(){ if(mouseIn){ mouseIn = false; updTarget(); } });

    window._syncHeader = function(){
      curH = wrap.offsetHeight;
      if(curH > maxH) maxH = curH;
      document.body.style.paddingTop = curH + 'px';
      if(tooSmall()){ targetP = 0; currentP = 0; updateT(); }
      syncBtns();
      if(!rafId) updateT();
    };
    window.addEventListener('resize', function(){ window._syncHeader(); });

    requestAnimationFrame(function(){
      scrollY = getSY();
      curH = wrap.offsetHeight;
      maxH = curH;
      document.body.style.paddingTop = curH + 'px';
      try{ const s = localStorage.getItem('hs_header_mode'); if(s==='pinned'||s==='sticky'||s==='auto') mode = s; }catch(e){}
      currentP = mode==='pinned' ? 0 : 1;
      targetP = currentP;
      updateT();
      syncBtns();
    });
  })();

  // 初始化
  refresh();
})();
</script>
</body>
</html>
