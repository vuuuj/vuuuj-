<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炉石传说 · 酒馆战棋 · 全卡牌</title>
<style>
  :root{
    --bg:#1a1a2e; --bg2:#16213e; --card:#1a1a3e; --card2:#222255;
    --gold:#f0d9a8; --gold2:#d4b06c; --gold-dim:#a08868;
    --txt:#e8e0d0; --txt2:#a09080; --line:#3a3a5e;
    --mythic:#ff80ad; --accent:#80d0ff;
    --on-gold:#2a1f10;
    --t1:#1a6b3c; --t2:#1a6b3c; --t3:#2a6b9a; --t4:#6a3a8a; --t5:#8a4a1a; --t6:#b8860b; --t7:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);margin:0;line-height:1.6;
    background-image:radial-gradient(1200px 600px at 50% -200px, rgba(100,80,180,.06), transparent 60%);}
  a{color:var(--gold2)}
  .header-wrap{
    position:fixed; top:0; left:0; right:0; z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    will-change:transform;
  }
  .topbar{background:rgba(26,26,46,.95);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 20px 10px}
  .topbar h1{margin:0 0 10px;font-size:20px;color:var(--gold);letter-spacing:1px;font-weight:600}
  .topbar h1 .sub{font-size:12px;color:var(--txt2);font-weight:400;margin-left:8px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:7px 18px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--txt2);
    cursor:pointer;font-size:14px;transition:.18s;user-select:none}
  .tab:hover{color:var(--gold);border-color:var(--gold-dim)}
  .tab.active{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--on-gold);border-color:var(--gold);font-weight:600}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:8px 34px;border-radius:20px;border:1px solid var(--line);
    background:var(--bg2);color:var(--txt);font-size:13px;outline:none}
  .search input:focus{border-color:var(--gold-dim)}
  .search::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:15px}
  .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;transition:.15s}
  .search-clear:hover{border-color:var(--gold-dim);background:rgba(201,169,97,.18)}
  .search-clear svg{display:block}
  .search.has-value .search-clear{display:flex}
  .count{font-size:13px;color:var(--txt2);white-space:nowrap}
  .count b{color:var(--gold)}
  .filters{padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(22,33,62,.5)}
  .dim{display:flex;align-items:flex-start;gap:10px;margin:6px 0;flex-wrap:wrap}
  .dim-label{min-width:56px;font-size:12px;color:var(--gold-dim);padding-top:5px;flex-shrink:0}
  .dim-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .ftag{padding:3px 11px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);
    color:var(--txt2);font-size:12px;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
  .ftag:hover{color:var(--gold);border-color:var(--gold-dim)}
  .ftag.active{background:rgba(201,169,97,.18);color:var(--gold);border-color:var(--gold2)}
  .ftag .n{opacity:.5;font-size:11px;margin-left:3px}
  .clear-btn{padding:3px 11px;border-radius:14px;border:1px dashed var(--line);background:transparent;
    color:var(--txt2);font-size:12px;cursor:pointer}
  .clear-btn:hover{color:var(--mythic);border-color:var(--mythic)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;padding:16px 20px 60px;margin-top:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;
    transition:.16s;display:flex;flex-direction:column;overflow:hidden}
  .card:hover{border-color:var(--gold-dim);background:var(--card2);transform:translateY(-2px)}
  .card-img-wrap{width:100%;background:var(--bg2);display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
  .card-img-wrap img{width:100%;max-width:var(--img-max-w,256px);display:block;object-fit:contain}
  .card-tier{position:absolute;top:6px;right:6px;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;line-height:1.4}
  .card-race{position:absolute;top:6px;left:6px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);color:var(--gold2);line-height:1.4}
  .card-body{padding:10px 14px 14px}
  .card-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .card-name{font-size:16px;font-weight:bold;color:var(--gold)}
  .card-stats{display:flex;gap:10px;margin:6px 0;font-size:14px}
  .card-stat{display:flex;align-items:center;gap:4px}
  .card-stat .atk{color:#d44;font-weight:700}
  .card-stat .hp{color:#4d4;font-weight:700}
  .card-stat .icon{font-size:16px}
  .card-text{margin:6px 0;font-size:13px;line-height:1.65;color:var(--txt)}
  .card-text b{color:var(--gold2)}
  .card-flavor{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--txt2);font-style:italic}
  .card-artist{font-size:11px;color:var(--txt2);margin-top:4px;opacity:.6}
  .card-mechanics{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .mech-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;
    background:rgba(80,120,200,.25);color:#80b0ff}
  .mech-tag.taunt{background:rgba(150,130,50,.25);color:#d4b06c}
  .mech-tag.divine-shield{background:rgba(200,180,80,.25);color:#f0e060}
  .mech-tag.windfury{background:rgba(80,200,180,.25);color:#60e0d0}
  .mech-tag.reborn{background:rgba(200,100,150,.25);color:#e080b0}
  .mech-tag.venomous{background:rgba(80,200,80,.25);color:#60e060}
  .mech-tag.battlecry{background:rgba(200,120,60,.25);color:#e09050}
  .mech-tag.deathrattle{background:rgba(120,80,160,.25);color:#b080e0}
  .mech-tag.magnetic{background:rgba(100,160,200,.25);color:#80c0e0}
  .mech-tag.stealth{background:rgba(80,80,80,.25);color:#a0a0a0}
  .card-hp{background:rgba(60,100,180,.15);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;border-left:2px solid var(--gold2)}
  .card-hp .hp-name{color:var(--gold2);font-weight:600;font-size:13px}
  .card-hp .hp-text{color:var(--txt2);margin-top:3px;line-height:1.5}
  .card-hp .hp-cost{display:inline-block;background:var(--gold2);color:var(--on-gold);padding:1px 6px;border-radius:3px;font-size:11px;font-weight:700;margin-right:4px}
  .card-armor{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;
    background:rgba(100,80,180,.3);color:#b090e0;margin-left:6px}
  .card-spell-cost{display:inline-block;background:rgba(60,100,200,.3);color:#80b0ff;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;margin-right:6px}
  .card-trinket-type{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;
    margin-right:6px}
  .card-trinket-type.lesser{background:rgba(80,160,80,.3);color:#80e080}
  .card-trinket-type.greater{background:rgba(200,120,60,.3);color:#e09050}

  .card-subtitle{font-size:12px;color:var(--txt2);margin:2px 0 4px}

  .empty{text-align:center;color:var(--txt2);padding:80px 20px;grid-column:1/-1}
  .src{font-size:11px;color:var(--txt2);margin-top:4px;padding:10px 20px;text-align:center;border-top:1px solid var(--line)}

  @media(max-width:560px){.grid{grid-template-columns:1fr;padding:12px}.topbar{padding:12px 12px 8px}.filters{padding:10px 12px}}

  .card.hero-card .card-img-wrap{background:linear-gradient(180deg,var(--bg2),#1a1a2e)}
  .card.hero-card .card-body{padding:10px 14px 14px}
  .card.hero-card .card-name{font-size:17px}

  img[loading=lazy]{background:var(--bg2)}
  .card-winrate{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(80,200,80,.25);color:#60e060;margin-left:6px}
  .grid{transition:margin-top .15s ease}
  .ftag .n{opacity:.5;font-size:11px;margin-left:3px}
  .header-ctl{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .pin-btn,.auto-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--txt2);
    cursor:pointer;transition:color .15s,border-color .15s,background .15s,transform .3s ease,opacity .3s ease;flex-shrink:0}
  .pin-btn:hover,.auto-btn:hover{color:var(--gold);border-color:var(--gold-dim)}
  .pin-btn svg{transition:transform .2s}
  .pin-btn:not(.pinned){color:#9a9a9a;border-color:var(--line);background:transparent}
  .pin-btn:not(.pinned) svg{transform:rotate(-45deg)}
  .pin-btn.pinned{color:var(--gold2);border-color:var(--gold2);background:rgba(201,169,97,.2)}
  .auto-btn{z-index:2;font-size:13px;font-weight:700}
  .pin-btn{z-index:1}
  .pin-btn.folded{transform:scale(.3) translateX(36px);opacity:0;pointer-events:none}
  .auto-btn.active{color:var(--gold2);border-color:var(--gold2);background:rgba(201,169,97,.2)}
  .pin-btn.disabled,.auto-btn.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
  .img-size-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .img-size-ctl label{font-size:12px;color:var(--gold-dim);white-space:nowrap}
  .img-size-ctl input[type=range]{width:100px;accent-color:var(--gold2);cursor:pointer}
  .img-size-val{font-size:12px;color:var(--txt2);min-width:32px;text-align:right}
</style>
</head>

let currentTab = 'minion';

const app = {
  data: DATA,
  init() {
    this.renderTabs();
    this.renderFilters();
    this.renderGrid();
    this.bindEvents();
    this.adjustMargin();
    window.addEventListener('resize', () => this.adjustMargin());
  },
  adjustMargin() {
    const header = document.getElementById('headerWrap');
    if (header) {
      document.body.style.paddingTop = header.offsetHeight + 'px';
      if (window._syncHeaderPadding) window._syncHeaderPadding();
    }
  },
  activeCards() {
    return this.data[this.currentDataType()] || [];
  },
  currentDataType() {
    const map = {minion:'minions',hero:'heroes',spell:'spells',trinket:'trinkets',quest:'quests',anomaly:'anomalies'};
    return map[currentTab] || 'minions';
  },
  filteredExcept(exceptDim) {
    let cards = this.activeCards();
    const q = searchText.toLowerCase().trim();
    if (q) {
      cards = cards.filter(c => {
        const searchTarget = c.name + ' ' + (c.text||'') + ' ' + (c.raceDisplay||'') + ' ' + (c.mechanicsDisplay||[]).join(' ') + ' ' + (c.heroPowerName||'') + ' ' + (c.heroPowerText||'') + ' ' + (c.armorTier||'') + ' ' + (c.type||'');
        return searchTarget.toLowerCase().includes(q);
      });
    }
    if (currentTab === 'minion') {
      if (exceptDim !== 'race' && activeFilters.race) {
        cards = cards.filter(c => c.race === activeFilters.race);
      }
      if (exceptDim !== 'tier' && activeFilters.tier) {
        cards = cards.filter(c => c.tier === parseInt(activeFilters.tier));
      }
      if (exceptDim !== 'mechanic' && activeFilters.mechanic) {
        cards = cards.filter(c => c.mechanics.includes(activeFilters.mechanic));
      }
    } else if (currentTab === 'trinket') {
      if (exceptDim !== 'trinketType' && activeFilters.trinketType) {
        cards = cards.filter(c => (activeFilters.trinketType === 'greater') === c.isGreater);
      }
    } else if (currentTab === 'spell') {
      if (exceptDim !== 'spellCost' && activeFilters.spellCost) {
        cards = cards.filter(c => c.cost === parseInt(activeFilters.spellCost));
      }
      if (exceptDim !== 'spellTier' && activeFilters.spellTier) {
        cards = cards.filter(c => c.tier === parseInt(activeFilters.spellTier));
      }
    }
    return cards;
  },
  filteredCards() {
    let cards = this.activeCards();
    const q = searchText.toLowerCase().trim();
    if (q) {
      cards = cards.filter(c => {
        const searchTarget = c.name + ' ' + (c.text||'') + ' ' + (c.raceDisplay||'') + ' ' + (c.mechanicsDisplay||[]).join(' ') + ' ' + (c.heroPowerName||'') + ' ' + (c.heroPowerText||'') + ' ' + (c.armorTier||'') + ' ' + (c.type||'');
        return searchTarget.toLowerCase().includes(q);
      });
    }
    // Apply tab-specific filters
    if (currentTab === 'minion') {
      if (activeFilters.race) {
        cards = cards.filter(c => c.race === activeFilters.race);
      }
      if (activeFilters.tier) {
        cards = cards.filter(c => c.tier === parseInt(activeFilters.tier));
      }
      if (activeFilters.mechanic) {
        cards = cards.filter(c => c.mechanics.includes(activeFilters.mechanic));
      }
    } else if (currentTab === 'trinket') {
      if (activeFilters.trinketType) {
        cards = cards.filter(c => (activeFilters.trinketType === 'greater') === c.isGreater);
      }
    } else if (currentTab === 'spell') {
      if (activeFilters.spellCost) {
        cards = cards.filter(c => c.cost === parseInt(activeFilters.spellCost));
      }
      if (activeFilters.spellTier) {
        cards = cards.filter(c => c.tier === parseInt(activeFilters.spellTier));
      }
    }
    return cards;
  },
  renderTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === currentTab);
    });
    // Update tab counts
    const tMap = {minion:'minions',hero:'heroes',spell:'spells',trinket:'trinkets',quest:'quests',anomaly:'anomalies'};
    for (const [k,v] of Object.entries(tMap)) {
      const el = document.getElementById('tabCnt' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el) el.textContent = '(' + this.data[v].length + ')';
    }
  },
  renderFilters() {
    const container = document.getElementById('filters');
    if (currentTab === 'minion') {
      let html = '';
      // Race filter with dynamic counts
      const raceBase = this.filteredExcept('race');
      html += '<div class="dim" data-dim="race">';
      html += '<div class="dim-label">种族</div>';
      html += '<div class="dim-tags">';
      if (activeFilters.race) {
        html += '<span class="clear-btn" data-dim="race" title="清除筛选">✕ 清除</span>';
      }
      for (const r of this.data.races) {

        if (n === 0 && activeFilters.race !== r.key) continue;
        const active = activeFilters.race === r.key ? ' active' : '';
        html += '<span class="ftag' + active + '" data-dim="race" data-value="' + r.key + '">' + r.display + '<span class="n">' + n + '</span></span>';

      const tierLabels = {1:'1星',2:'2星',3:'3星',4:'4星',5:'5星',6:'6星',7:'7星'};
      for (let i = 1; i <= 7; i++) {
        const n = tierBase.filter(c => c.tier === i).length;
        if (n === 0 && activeFilters.tier !== String(i)) continue;
        const active = activeFilters.tier === String(i) ? ' active' : '';
        html += '<span class="ftag' + active + '" data-dim="tier" data-value="' + i + '">' + tierLabels[i] + '<span class="n">' + n + '</span></span>';
      }
      html += '</div></div>';
      // Mechanic filter with dynamic counts
      const mechBase = this.filteredExcept('mechanic');
      html += '<div class="dim" data-dim="mechanic">';
      html += '<div class="dim-label">关键字</div>';
      html += '<div class="dim-tags">';
      if (activeFilters.mechanic) {
        html += '<span class="clear-btn" data-dim="mechanic" title="清除筛选">✕ 清除</span>';
      }
      for (const m of this.data.mechanics) {
        const n = mechBase.filter(c => c.mechanics.includes(m.key)).length;
        if (n === 0 && activeFilters.mechanic !== m.key) continue;
        const active = activeFilters.mechanic === m.key ? ' active' : '';
        html += '<span class="ftag' + active + '" data-dim="mechanic" data-value="' + m.key + '">' + m.display + '<span class="n">' + n + '</span></span>';
      }
      html += '</div></div>';
      container.innerHTML = html;
    } else if (currentTab === 'trinket') {
      const trinketBase = this.filteredExcept('trinketType');
      let html = '<div class="dim" data-dim="trinketType">';
      html += '<div class="dim-label">类型</div>';
      html += '<div class="dim-tags">';
      if (activeFilters.trinketType) {
        html += '<span class="clear-btn" data-dim="trinketType" title="清除筛选">✕ 清除</span>';
      }
      const nL = trinketBase.filter(c => !c.isGreater).length;
      const nG = trinketBase.filter(c => c.isGreater).length;
      const activeL = activeFilters.trinketType === 'lesser' ? ' active' : '';
      const activeG = activeFilters.trinketType === 'greater' ? ' active' : '';
      if (nL > 0 || activeFilters.trinketType === 'lesser')
        html += '<span class="ftag' + activeL + '" data-dim="trinketType" data-value="lesser">小饰品<span class="n">' + nL + '</span></span>';
      if (nG > 0 || activeFilters.trinketType === 'greater')
        html += '<span class="ftag' + activeG + '" data-dim="trinketType" data-value="greater">大饰品<span class="n">' + nG + '</span></span>';
      html += '</div></div>';
      container.innerHTML = html;
    } else if (currentTab === 'spell') {
      const costBase = this.filteredExcept('spellCost');
      let html = '<div class="dim" data-dim="spellCost">';
      html += '<div class="dim-label">铸币</div>';
      html += '<div class="dim-tags">';
      if (activeFilters.spellCost) {
        html += '<span class="clear-btn" data-dim="spellCost" title="清除筛选">✕ 清除</span>';
      }
      for (let i = 1; i <= 5; i++) {
        const n = costBase.filter(c => c.cost === i).length;
        if (n === 0 && activeFilters.spellCost !== String(i)) continue;
        const active = activeFilters.spellCost === String(i) ? ' active' : '';
        html += '<span class="ftag' + active + '" data-dim="spellCost" data-value="' + i + '">' + i + '铸币<span class="n">' + n + '</span></span>';
      }
      html += '</div></div>';
      const tierBase = this.filteredExcept('spellTier');
      html += '<div class="dim" data-dim="spellTier">';
      html += '<div class="dim-label">等级</div>';
      html += '<div class="dim-tags">';
      if (activeFilters.spellTier) {

      const tierLabels = {1:'1星',2:'2星',3:'3星',4:'4星',5:'5星',6:'6星',7:'7星'};
      for (let i = 1; i <= 7; i++) {
        const n = tierBase.filter(c => c.tier === i).length;
        if (n === 0 && activeFilters.spellTier !== String(i)) continue;
        const active = activeFilters.spellTier === String(i) ? ' active' : '';
        html += '<span class="ftag' + active + '" data-dim="spellTier" data-value="' + i + '">' + tierLabels[i] + '<span class="n">' + n + '</span></span>';
      }
      html += '</div></div>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '';
    }
    // Bind filter events
    container.querySelectorAll('.ftag').forEach(el => {
      el.addEventListener('click', () => {
        const dim = el.dataset.dim;
        const val = el.dataset.value;
        if (activeFilters[dim] === val) {
          delete activeFilters[dim];
        } else {
          activeFilters[dim] = val;
        }
        this.renderFilters();
        this.renderGrid();
      });
    });
    container.querySelectorAll('.clear-btn').forEach(el => {
      el.addEventListener('click', () => {
        const dim = el.dataset.dim;
        delete activeFilters[dim];
        this.renderFilters();
        this.renderGrid();
      });
    });
    this.adjustMargin();
  },
  renderGrid() {
    const cards = this.filteredCards();
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    count.innerHTML = '共 <b>' + cards.length + '</b> 张';
    if (cards.length === 0) {
      grid.innerHTML = '<div class="empty">没有匹配的卡牌</div>';
      return;
    }

    if (currentTab === 'minion') {
      for (const c of cards) {
        const tierColor = DATA.tierColors[String(c.tier)] || '#666';
        const imgUrl = 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/' + c.id + '.png';
        const mechHtml = c.mechanics.map(m => {
          const cls = m.toLowerCase().replace(/_/g, '-');
          return '<span class="mech-tag ' + cls + '">' + (DATA.mechMap[m] || m) + '</span>';
        }).join('');
        html += '<div class="card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '<div class="card-tier" style="background:' + tierColor + '">' + c.tier + '星</div>';
        if (c.raceDisplay) {
          html += '<div class="card-race">' + c.raceDisplay + '</div>';
        }
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '</div>';
        html += '<div class="card-stats"><span class="card-stat"><span class="icon">⚔</span><span class="atk">' + c.attack + '</span></span><span class="card-stat"><span class="icon">❤</span><span class="hp">' + c.health + '</span></span></div>';
        if (mechHtml) {
          html += '<div class="card-mechanics">' + mechHtml + '</div>';
        }
        if (c.text) {
          html += '<div class="card-text">' + c.text.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
        }
        if (c.flavor) {
          html += '<div class="card-flavor">"' + c.flavor + '"</div>';
        }
        if (c.artist) {
          html += '<div class="card-artist">绘师：' + c.artist + '</div>';
        }
        html += '</div></div>';
      }
    } else if (currentTab === 'hero') {
      for (const c of cards) {
        const imgUrl = 'https://art.hearthstonejson.com/v1/256x/' + c.id + '.webp';
        html += '<div class="card hero-card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '<span class="card-winrate">' + c.winrate + '%</span><span class="card-armor">' + (c.armor ? '护甲 ' + c.armor : '') + '</span></div>';
        if (c.heroPowerName) {
          html += '<div class="card-hp">';
          html += '<div class="hp-name"><span class="hp-cost">' + c.heroPowerCost + '</span>' + c.heroPowerName + '</div>';
          html += '<div class="hp-text">' + c.heroPowerText.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
          html += '</div>';
        }
        html += '</div></div>';
      }
    } else if (currentTab === 'spell') {
      for (const c of cards) {
        const tierColor = DATA.tierColors[String(c.tier)] || '#666';
        const imgUrl = 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/' + c.id + '.png';
        html += '<div class="card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '<div class="card-tier" style="background:' + tierColor + '">' + c.tier + '星</div>';
        if (c.raceDisplay) {
          html += '<div class="card-race">' + c.raceDisplay + '</div>';
        }
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '</div>';
        html += '<div class="card-subtitle"><span class="card-spell-cost">' + c.cost + '铸币</span>法术</div>';
        if (c.text) {
          html += '<div class="card-text">' + c.text.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
        }
        html += '</div></div>';
      }
    } else if (currentTab === 'trinket') {
      for (const c of cards) {
        const imgUrl = 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/' + c.id + '.png';
        const typeClass = c.isGreater ? 'greater' : 'lesser';
        html += '<div class="card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '</div>';
        html += '<div class="card-subtitle"><span class="card-spell-cost">' + c.cost + '铸币</span><span class="card-trinket-type ' + typeClass + '">' + c.type + '</span></div>';
        if (c.text) {
          html += '<div class="card-text">' + c.text.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
        }
        html += '</div></div>';
      }
    } else if (currentTab === 'quest') {
      for (const c of cards) {
        const imgUrl = 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/' + c.id + '.png';
        html += '<div class="card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '</div>';
        if (c.text) {
          html += '<div class="card-text">' + c.text.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
        }
        html += '</div></div>';
      }
    } else if (currentTab === 'anomaly') {
      for (const c of cards) {
        const imgUrl = 'https://art.hearthstonejson.com/v1/bgs/latest/zhCN/256x/' + c.id + '.png';
        html += '<div class="card" data-id="' + c.id + '">';
        html += '<div class="card-img-wrap">';
        html += '<img src="' + imgUrl + '" loading="lazy" alt="' + c.name + '" onerror="this.remove()">';
        html += '</div>';
        html += '<div class="card-body">';
        html += '<div class="card-name">' + c.name + '</div>';
        if (c.text) {
          html += '<div class="card-text">' + c.text.replace(/<b>/g, '<b>').replace(/<\/b>/g, '</b>').replace(/\n/g, '<br>') + '</div>';
        }
        html += '</div></div>';
      }
    }
    grid.innerHTML = html;
  },
  bindEvents() {
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.type;
        activeFilters = {};
        searchText = '';
        document.getElementById('search').value = '';
        document.getElementById('searchWrap').classList.remove('has-value');
        this.renderTabs();
        this.renderFilters();
        this.renderGrid();
      });
    });
    // Search
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', () => {
      searchText = searchInput.value;
      document.getElementById('searchWrap').classList.toggle('has-value', searchText.length > 0);
      this.renderGrid();
    });
    document.getElementById('searchClear').addEventListener('click', () => {
      searchInput.value = '';
      searchText = '';
      document.getElementById('searchWrap').classList.remove('has-value');
      this.renderGrid();
      searchInput.focus();
    });
  }
};

// ============ IMAGE SIZE CONTROL ============
(function imgSizeCtrl() {
  const slider = document.getElementById('imgSizeSlider');
  const val = document.getElementById('imgSizeVal');
  try {
    const saved = localStorage.getItem('hs_img_size');
    if (saved) { slider.value = saved; }
  } catch(e) {}
  function applySize(v) {
    document.documentElement.style.setProperty('--img-max-w', v + 'px');
    val.textContent = v;
  }
  applySize(slider.value);
  slider.addEventListener('input', () => {
    applySize(slider.value);
    try { localStorage.setItem('hs_img_size', slider.value); } catch(e) {}
  });
})();

// ============ HEADER CONTROL (auto mode) ============
(function headerCtrl() {
  const wrap = document.getElementById('headerWrap');
  const pinBtn = document.getElementById('pinBtn');
  const autoBtn = document.getElementById('autoBtn');
  let mode = 'sticky';
  let prevModeBeforeAuto = 'sticky';
  let currentP = 1;
  let targetP = 1;
  let hideUntilMouseMove = false;
  const DAMPING = 12;
  let rafId = null;
  let lastFrameTime = 0;
  let currentScrollY = window.scrollY || document.documentElement.scrollTop;
  let currentHeight = 0;
  let maxHeight = 0;
  let lastMove = 0;
  let mouseInZone = false;
  const getScrollY = () => window.scrollY || document.documentElement.scrollTop;

  function updateTransform() {
    const y = -currentScrollY * (1 - currentP);
    wrap.style.transform = 'translateY(' + y + 'px)';
  }
  function tick(now) {
    if (!lastFrameTime) lastFrameTime = now;
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;
    const factor = 1 - Math.exp(-DAMPING * dt);
    currentP += (targetP - currentP) * factor;
    if (Math.abs(targetP - currentP) < 0.001) {
      currentP = targetP;
      rafId = null;
      lastFrameTime = 0;
    }
    updateTransform();
    if (rafId) rafId = requestAnimationFrame(tick);
  }
  function startAnim() {
    if (!rafId) { lastFrameTime = 0; rafId = requestAnimationFrame(tick); }
  }
  function isTooSmall() { return maxHeight > window.innerHeight * 0.9; }
  function syncButtons() {
    const tooSmall = isTooSmall();
    pinBtn.classList.toggle('pinned', mode === 'pinned' && !tooSmall);
    pinBtn.classList.toggle('folded', mode === 'auto' && !tooSmall);
    pinBtn.classList.toggle('disabled', tooSmall);
    autoBtn.classList.toggle('active', mode === 'auto' && !tooSmall);
    autoBtn.classList.toggle('disabled', tooSmall);
    if (tooSmall) {
      pinBtn.title = '窗口高度不足，顶栏已固定';
      autoBtn.title = '窗口高度不足';
    } else {
      pinBtn.title = mode === 'pinned'
        ? '顶栏固定在网页顶部（点击切换为随显示区域移动）'
        : '顶栏随显示区域移动（点击切换为固定在网页顶部）';
      autoBtn.title = mode === 'auto'
        ? '自动模式已开启（点击关闭）'
        : '自动切换模式（滚轮隐藏，移到顶部显示）';
    }
  }
  function saveMode() { try { localStorage.setItem('hs_header_mode', mode); } catch(e) {} }
  function updateTarget() {
    if (isTooSmall()) { targetP = 0; }
    else if (mode === 'sticky') { targetP = 1; }
    else if (mode === 'pinned') { targetP = 0; }
    else { targetP = (currentScrollY < 8 || (mouseInZone && !hideUntilMouseMove)) ? 1 : 0; }
    startAnim();
    syncButtons();
  }
  function applyMode(animate) {
    if (!animate) {
      if (isTooSmall()) currentP = 0;
      else if (mode === 'sticky') currentP = 1;
      else if (mode === 'pinned') currentP = 0;
      else currentP = currentScrollY < 8 || (mouseInZone && !hideUntilMouseMove) ? 1 : 0;
      targetP = currentP;
      updateTransform();
    }
    updateTarget();
  }
  pinBtn.addEventListener('click', () => {
    if (isTooSmall() || mode === 'auto') return;
    mode = mode === 'pinned' ? 'sticky' : 'pinned';
    updateTarget();
    saveMode();
  });
  autoBtn.addEventListener('click', () => {
    if (isTooSmall()) return;
    if (mode === 'auto') { mode = prevModeBeforeAuto; }
    else { prevModeBeforeAuto = mode; mode = 'auto'; }
    updateTarget();
    saveMode();
  });
  window.addEventListener('scroll', () => {
    currentScrollY = getScrollY();
    if (isTooSmall()) { targetP = 0; currentP = 0; updateTransform(); return; }
    if (mode === 'auto' && currentScrollY >= 8) { hideUntilMouseMove = true; }
    if (mode === 'sticky' && Math.abs(currentP - 1) < 0.001) {
      currentP = 1; targetP = 1; updateTransform(); return;
    }
    if (mode === 'pinned' && Math.abs(currentP - 0) < 0.001) {
      currentP = 0; targetP = 0; updateTransform(); return;
    }
    updateTarget();
  }, { passive: true });
  document.addEventListener('mousemove', (e) => {
    if (mode !== 'auto' || isTooSmall()) return;
    const now = performance.now();
    if (now - lastMove < 16) return;
    lastMove = now;
    const wasLocked = hideUntilMouseMove;
    hideUntilMouseMove = false;
    const inZone = e.clientY <= currentHeight;
    if (mouseInZone !== inZone || wasLocked) {
      mouseInZone = inZone;
      updateTarget();
    }
  });
  document.addEventListener('mouseleave', () => {
    if (mouseInZone) { mouseInZone = false; updateTarget(); }
  });
  window._syncHeaderPadding = function() {
    currentHeight = wrap.offsetHeight;
    if (currentHeight > maxHeight) maxHeight = currentHeight;
    document.body.style.paddingTop = currentHeight + 'px';
    if (isTooSmall()) { targetP = 0; currentP = 0; updateTransform(); }
    syncButtons();
    if (!rafId) updateTransform();
  };
  // Initialize
  requestAnimationFrame(() => {
    currentScrollY = getScrollY();
    currentHeight = wrap.offsetHeight;
    maxHeight = currentHeight;
    document.body.style.paddingTop = currentHeight + 'px';
    try {
      const saved = localStorage.getItem('hs_header_mode');
      if (saved === 'pinned' || saved === 'sticky' || saved === 'auto') mode = saved;
    } catch(e) {}
    currentP = mode === 'pinned' ? 0 : 1;
    targetP = currentP;
    updateTransform();
    syncButtons();
  });
})();

app.init();
</script>
